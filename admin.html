<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hintvite — Growth Engine</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./config.js"></script><style>body{font-family:Inter,Arial,sans-serif;background:#f5f3ef;color:#1f2726;margin:0}.wrap{max-width:1200px;margin:auto;padding:28px}.card{background:#fff;border:1px solid #ddd8cf;border-radius:14px;padding:20px;margin:14px 0}h1{margin:0 0 8px}button{background:#14544c;color:#fff;border:0;border-radius:8px;padding:10px 15px;cursor:pointer}input{padding:11px;border:1px solid #ccc;border-radius:8px;width:100%;box-sizing:border-box;margin:5px 0 10px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid #eee;font-size:13px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat b{display:block;font-size:28px}.muted{color:#6d756f;font-size:13px}.error{color:#9b3d2f}.hidden{display:none}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}</style></head><body><main class="wrap"><div id="login" class="card"><h1>Hintvite Growth Engine</h1><p class="muted">Accès administrateur</p><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Mot de passe"><button id="loginBtn">Se connecter</button><p id="msg" class="error"></p></div><div id="app" class="hidden"><div style="display:flex;justify-content:space-between;align-items:center"><div><h1>Hintvite Growth Engine</h1><div class="muted">Pilotage de la prospection et des réponses.</div></div><button id="logout">Déconnexion</button></div><div class="grid"><div class="card stat"><b id="r">0</b>réponses</div><div class="card stat"><b id="p">0</b>prospects</div><div class="card stat"><b id="hot">0</b>prospects prioritaires</div><div class="card stat"><b id="m">0</b>marques</div></div><div class="card"><h2>Réponses questionnaire</h2><table><thead><tr><th>Date</th><th>Nom</th><th>Cabinet</th><th>Ville</th><th>Test</th><th>Email</th></tr></thead><tbody id="responses"></tbody></table></div><div class="card"><h2>Prospects</h2><table><thead><tr><th>Cabinet</th><th>Contact</th><th>Ville</th><th>Score</th><th>Statut</th><th>Dernier contact</th></tr></thead><tbody id="prospects"></tbody></table></div></div></main><script>
const C=window.HINTVITE_CONFIG||{};const sb=window.supabase.createClient(C.SUPABASE_URL,C.SUPABASE_PUBLISHABLE_KEY);const $=id=>document.getElementById(id);
async function refresh(){const [{data:r},{data:p},{data:b}]=await Promise.all([sb.from('questionnaire_responses').select('*').order('created_at',{ascending:false}).limit(100),sb.from('prospects').select('*').order('score',{ascending:false}).limit(100),sb.from('brands').select('id')]);$('r').textContent=r?.length||0;$('p').textContent=p?.length||0;$('hot').textContent=(p||[]).filter(x=>(x.score||0)>=80).length;$('m').textContent=b?.length||0;$('responses').innerHTML=(r||[]).map(x=>`<tr><td>${new Date(x.created_at).toLocaleDateString('fr-FR')}</td><td>${x.full_name||''}</td><td>${x.company||''}</td><td>${x.city||''}</td><td>${x.payload?.test||''}</td><td>${x.email||''}</td></tr>`).join('');$('prospects').innerHTML=(p||[]).map(x=>`<tr><td>${x.company||''}</td><td>${x.contact_name||''}</td><td>${x.city||''}</td><td><b>${x.score??'—'}</b></td><td>${x.status||''}</td><td>${x.last_contact_at?new Date(x.last_contact_at).toLocaleDateString('fr-FR'):'—'}</td></tr>`).join('')}
sb.auth.onAuthStateChange(async(_,s)=>{if(s){$('login').classList.add('hidden');$('app').classList.remove('hidden');await refresh();}else{$('login').classList.remove('hidden');$('app').classList.add('hidden')}});
$('loginBtn').onclick=async()=>{const {error}=await sb.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error)$('msg').textContent=error.message};$('logout').onclick=()=>sb.auth.signOut();
</script></body></html>
